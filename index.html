<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장비 수령/출고 테스트</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 480px; margin: 0 auto; background: #f8f9fa; }
    .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .row { display: flex; justify-content: space-between; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #eee; }
    .label { font-weight: bold; color: #555; }
    input[type="text"], input[type="date"] { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-block { width: 100%; background: #24292f; color: white; margin-top: 8px; }
    .btn-recv { background: #2da44e; color: white; width: 48%; }
    .btn-disp { background: #0969da; color: white; width: 48%; }
    .btn-group { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .hidden { display: none; }
    .err { color: red; font-size: 13px; }
  </style>
</head>
<body>

  <!-- 1. 끝 6자리 인증 화면 -->
  <div id="auth-box" class="card">
    <h3>시리얼 인증</h3>
    <p>시리얼 번호 끝 6자리를 입력하세요.</p>
    <input type="text" id="input-serial" maxlength="6" placeholder="예: 123456">
    <button class="btn-block" onclick="checkAuth()">확인</button>
    <p id="auth-err" class="err hidden">시리얼 번호 끝자리가 맞지 않습니다.</p>
  </div>

  <!-- 2. 장비 정보 및 처리 화면 -->
  <div id="content-box" class="hidden">
    <div class="card">
      <h3>장비 정보</h3>
      <div class="row"><span class="label">AM:</span><span id="v-am"></span></div>
      <div class="row"><span class="label">PM:</span><span id="v-pm"></span></div>
      <div class="row"><span class="label">시리얼번호:</span><span id="v-serial"></span></div>
      <div class="row"><span class="label">사이트:</span><span id="v-site"></span></div>
    </div>

    <div class="card">
      <h3>작업 선택</h3>
      <div class="btn-group">
        <button class="btn-recv" onclick="openForm('수령')">수령</button>
        <button class="btn-disp" onclick="openForm('출고')">출고</button>
      </div>

      <div id="input-form" class="hidden">
        <h4 id="form-type"></h4>
        <label class="label">담당자 이름</label>
        <input type="text" id="worker-name" placeholder="이름 입력">
        
        <label class="label">처리 일자</label>
        <input type="date" id="worker-date">

        <button class="btn-block" id="save-btn" onclick="saveData()">GitHub에 저장</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚠️ 아래 3가지 값을 본인 정보로 수정하세요.
    // ==========================================
    const GITHUB_OWNER = "sunchan240242@gmail.com";       // 본인 GitHub 아이디
    const GITHUB_REPO  = "robustappliance/qr-asset-management";              // 저장소 이름
    const GITHUB_TOKEN = "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";  // 발급받은 Classic 토큰
    const DATA_FILE    = "records.json";

    let qrData = null;
    let currentType = "";

    // 1. 페이지 로드 시 URL의 ?data= 파라미터 파싱
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const raw = urlParams.get("data");

      if (!raw) {
        alert("QR 데이터가 없습니다. URL을 확인하세요.");
        document.getElementById("auth-box").classList.add("hidden");
        return;
      }

      try {
        qrData = JSON.parse(decodeURIComponent(raw));
      } catch (e) {
        alert("데이터 파싱 실패");
      }
    };

    // 2. 끝 6자리 확인
    function checkAuth() {
      const input = document.getElementById("input-serial").value.trim();
      const actual = String(qrData.serial);
      const last6 = actual.slice(-6);

      if (input === last6) {
        document.getElementById("auth-box").classList.add("hidden");
        document.getElementById("content-box").classList.remove("hidden");

        document.getElementById("v-am").textContent = qrData.am;
        document.getElementById("v-pm").textContent = qrData.pm;
        document.getElementById("v-serial").textContent = qrData.serial;
        document.getElementById("v-site").textContent = qrData.site;
      } else {
        document.getElementById("auth-err").classList.remove("hidden");
      }
    }

    // 3. 수령 / 출고 버튼 클릭
    function openForm(type) {
      currentType = type;
      document.getElementById("form-type").textContent = `[${type}] 정보 입력`;
      document.getElementById("input-form").classList.remove("hidden");
      document.getElementById("worker-date").value = new Date().toISOString().split("T")[0];
    }

    // 4. GitHub records.json 파일에 직접 저장
    async function saveData() {
      const name = document.getElementById("worker-name").value.trim();
      const date = document.getElementById("worker-date").value;
      const btn = document.getElementById("save-btn");

      if (!name || !date) {
        alert("이름과 날짜를 입력하세요.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "저장 중...";

      const newEntry = {
        type: currentType,
        worker: name,
        date: date,
        saved_at: new Date().toISOString(),
        device: qrData
      };

      const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE}`;

      try {
        // 기존 records.json 파일 확인
        let sha = null;
        let records = [];

        const getRes = await fetch(apiUrl, {
          headers: {
            "Authorization": `Bearer ${GITHUB_TOKEN}`,
            "Accept": "application/vnd.github.v3+json"
          }
        });

        if (getRes.status === 200) {
          const fileData = await getRes.json();
          sha = fileData.sha;
          const decoded = decodeURIComponent(escape(atob(fileData.content)));
          records = JSON.parse(decoded);
        }

        // 새 데이터 추가
        records.push(newEntry);

        // GitHub에 커밋
        const putRes = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${GITHUB_TOKEN}`,
            "Content-Type": "application/json",
            "Accept": "application/vnd.github.v3+json"
          },
          body: JSON.stringify({
            message: `Update: ${qrData.serial} - ${currentType} by ${name}`,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(records, null, 2)))),
            sha: sha || undefined
          })
        });

        if (putRes.ok) {
          alert(`${currentType} 저장 완료!`);
          location.reload();
        } else {
          const err = await putRes.json();
          alert(`저장 실패: ${err.message}`);
          btn.disabled = false;
          btn.textContent = "GitHub에 저장";
        }
      } catch (e) {
        alert("네트워크 오류 발생");
        btn.disabled = false;
        btn.textContent = "GitHub에 저장";
      }
    }
  </script>
</body>
</html>
